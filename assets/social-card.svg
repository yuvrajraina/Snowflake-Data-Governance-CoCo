<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Governance Script Studio</title>
  <desc id="description">Turn your catalogue into governance-ready Snowflake SQL.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="68%">
      <stop offset="0" stop-color="#174a43"/>
      <stop offset=".56" stop-color="#0a2929"/>
      <stop offset="1" stop-color="#061a1c"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7faf7"/>
      <stop offset="1" stop-color="#e7efea"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#001010" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1050" cy="20" r="305" fill="none" stroke="#c8f36a" stroke-opacity=".05" stroke-width="90"/>
  <circle cx="1050" cy="20" r="185" fill="none" stroke="#c8f36a" stroke-opacity=".045" stroke-width="60"/>
  <g transform="translate(72 56)">
    <rect width="56" height="56" rx="14" fill="#c8f36a"/>
    <text x="28" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#092325">GS</text>
    <text x="72" y="23" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#f1faf5">Governance</text>
    <text x="72" y="46" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#91aaa1">SCRIPT STUDIO</text>
  </g>
  <g transform="translate(72 185)">
    <rect width="278" height="30" rx="15" fill="#c8f36a" fill-opacity=".07" stroke="#c8f36a" stroke-opacity=".35"/>
    <circle cx="19" cy="15" r="5" fill="#c8f36a"/>
    <text x="34" y="19" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#dcebe4">BROWSER-LOCAL GOVERNANCE</text>
    <text x="0" y="104" font-family="Georgia, serif" font-size="66" font-weight="500" letter-spacing="-3" fill="#f0faf5">Catalogue in.</text>
    <text x="0" y="176" font-family="Georgia, serif" font-size="66" font-style="italic" font-weight="500" letter-spacing="-3" fill="#c8f36a">Governance-ready</text>
    <text x="0" y="248" font-family="Georgia, serif" font-size="66" font-weight="500" letter-spacing="-3" fill="#f0faf5">Snowflake SQL out.</text>
    <text x="0" y="299" font-family="Arial, sans-serif" font-size="17" fill="#9eb6ad">Import · Review · Approve · Generate eight SQL files</text>
  </g>
  <g transform="translate(750 150)" filter="url(#shadow)">
    <rect width="378" height="376" rx="18" fill="url(#panel)"/>
    <rect width="378" height="42" rx="18" fill="#f9fbf9"/>
    <rect y="24" width="378" height="18" fill="#f9fbf9"/>
    <circle cx="20" cy="21" r="4" fill="#bfd0c8"/>
    <circle cx="34" cy="21" r="4" fill="#bfd0c8"/>
    <circle cx="48" cy="21" r="4" fill="#bfd0c8"/>
    <rect x="20" y="68" width="338" height="74" rx="10" fill="#fff" stroke="#ccddd5"/>
    <rect x="34" y="86" width="39" height="39" rx="8" fill="#e3f5e9"/>
    <text x="53.5" y="111" text-anchor="middle" font-family="Arial" font-size="10" font-weight="900" fill="#1b705b">XLS</text>
    <text x="88" y="99" font-family="Arial" font-size="11" font-weight="800" fill="#17312f">snowflake_catalogue.xlsx</text>
    <text x="88" y="118" font-family="Arial" font-size="9" fill="#84988f">258 tables · 5,689 columns</text>
    <rect x="302" y="91" width="39" height="20" rx="10" fill="#e2f5ed"/>
    <text x="321.5" y="104" text-anchor="middle" font-family="Arial" font-size="7" font-weight="800" fill="#24745f">READY</text>
    <g font-family="Arial" font-size="9">
      <rect x="20" y="160" width="338" height="52" rx="8" fill="#fff" stroke="#d8e4de"/>
      <text x="34" y="181" font-weight="800" fill="#1b3431">EMAIL</text><text x="180" y="181" fill="#83968f">TEXT</text>
      <rect x="282" y="172" width="59" height="18" rx="9" fill="#fff0d6"/><text x="311.5" y="184" text-anchor="middle" font-size="7" font-weight="800" fill="#8e5914">MASK</text>
      <text x="34" y="198" font-size="7" fill="#779088">Privacy identifier · Partial email</text>
      <rect x="20" y="222" width="338" height="52" rx="8" fill="#fff" stroke="#d8e4de"/>
      <text x="34" y="243" font-weight="800" fill="#1b3431">CUSTOMER_ID</text><text x="180" y="243" fill="#83968f">NUMBER</text>
      <rect x="274" y="234" width="67" height="18" rx="9" fill="#e1f4ec"/><text x="307.5" y="246" text-anchor="middle" font-size="7" font-weight="800" fill="#28725f">CLASSIFY</text>
      <text x="34" y="260" font-size="7" fill="#779088">Critical data element · Null check</text>
      <rect x="20" y="284" width="338" height="52" rx="8" fill="#fff" stroke="#d8e4de"/>
      <text x="34" y="305" font-weight="800" fill="#1b3431">UPDATED_AT</text><text x="180" y="305" fill="#83968f">TIMESTAMP</text>
      <rect x="287" y="296" width="54" height="18" rx="9" fill="#e1f4ec"/><text x="314" y="308" text-anchor="middle" font-size="7" font-weight="800" fill="#28725f">QUALITY</text>
      <text x="34" y="322" font-size="7" fill="#779088">Freshness metric · Reviewed</text>
    </g>
  </g>
</svg>
